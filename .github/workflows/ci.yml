# Gates for every PR and every push to main. Third-party actions are pinned by commit SHA (the same supply-chain rule
# as container images: see internal/archtest/supply_chain_test.go). Runners are pinned too (ubuntu-26.04, not ubuntu-latest), so a
# runner migration is a reviewed change instead of a surprise.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: format, vet, unit + architecture tests, race
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make fmt-check vet
      # the Kubernetes manifest against the API schemas (unknown or misplaced fields fail)
      - run: go run github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0 -strict -summary deploy/kubernetes/relayplane.yaml
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./internal/...
      # known vulnerabilities in the Go dependencies and the standard library that the code actually reaches (R34)
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  integration:
    name: real PostgreSQL + Redis + both object stores, chaos and load
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # adapter contract suites + the whole system suite against RustFS and SeaweedFS
      - run: make test-integration-s3
      # fault injection (Redis wipe/partition, PostgreSQL stall, worker kills, object store outage) and network jitter
      - run: make test-chaos
      # in-process load baseline with ordering / at-most-once checks
      - run: make test-load
      - if: always()
        run: make infra-down

  load-stack:
    name: multi-process load with worker kills
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test-load-stack WORKERS=4 INSTANCES=40 MESSAGES=2000 CHAOS_KILL=1
      # the healthy path, no kills: p95 of the delivery lag measured by the dispatchers must stay under 2 s
      - run: make test-load-stack WORKERS=4 INSTANCES=40 MESSAGES=2000 CHAOS_KILL=0 LOAD_MAX_EVENT_LAG_P95=2s

  sandbox:
    name: sandbox (simulator + python quickstart)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e sdk/python
      # the real stack with the provider simulator, driven by the SDK exactly like a consumer would
      - run: make test-sandbox

  sdk:
    name: python sdk
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: make sdk-test PYTHON=python

  staging:
    name: staging smoke (production configuration, real Evolution node)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e sdk/python
      # the same Dockerfiles a release builds, started with APP_ENV=production and the real (patched) Evolution image: what the
      # simulator-based sandbox cannot show (production guards, migrations from scratch, the node answering through the adapter)
      - run: sh deploy/staging/staging.sh build-local
      - run: sh deploy/staging/staging.sh up
      - run: sh deploy/staging/staging.sh smoke
      - if: failure()
        run: sh deploy/staging/staging.sh logs gateway worker reconciler 2>&1 | head -200 || true
        timeout-minutes: 2
      - if: always()
        run: sh deploy/staging/staging.sh down -v

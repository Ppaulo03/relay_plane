# Base Kubernetes manifests (no Helm). Secrets and PostgreSQL/Redis/S3 are expected to exist
# (managed services or separate charts). This file is a TEMPLATE: the images below are placeholders. A release (docs/RELEASE.md,
# .github/workflows/release.yml) renders it with cmd/render-release into relayplane-<version>.yaml, in which every image is pinned by
# digest; the renderer refuses to produce a manifest with a placeholder or an unpinned image. Deploy the rendered file, not this one.
#
# Provider nodes are stateful singletons -> StatefulSet (stable identity: evolution-v2-0, -1, ...).
# Gateway / worker / reconciler are stateless -> Deployments.
#
# Deploying a release is two steps, so the schema is migrated ONCE, before any new replica starts (no replica migrates by itself):
#   kubectl apply -f relayplane-<version>.yaml -l app.kubernetes.io/component=migrate
#   kubectl -n relayplane wait --for=condition=complete --timeout=10m job/relayplane-migrate
#   kubectl apply -f relayplane-<version>.yaml
# The finished Job deletes itself after an hour (ttlSecondsAfterFinished), so the next release can create it again.
#
# Metrics: every binary serves /metrics and /health on its ops port 9090, which no Service exposes; only Prometheus (namespace
# labelled relayplane.io/monitoring=true) may reach it. The gateway's public port 8080 does not serve /metrics in production.
apiVersion: v1
kind: Namespace
metadata: {name: relayplane}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: relayplane-config, namespace: relayplane}
data:
  APP_ENV: production
  REDIS_URL: redis://redis.relayplane.svc:6379/0
  BLOB_STORE_ENDPOINT: objectstore.relayplane.svc:9000   # any S3-compatible service (RustFS, SeaweedFS, MinIO, AWS S3, ...)
  BLOB_STORE_BUCKET: relayplane-media
  COMMAND_PARTITIONS: "32"
  MEDIA_INLINE_MAX_BYTES: "262144"
  DEFAULT_PROVIDER: evolution-v2
  WEBHOOK_BASE_URL: http://gateway.relayplane.svc:8080
  IDEMPOTENCY_TTL: 24h
  # attachments of inbound messages (25 MiB; a download costs ~3x the file in worker memory) and their retention
  INBOUND_MEDIA_MAX_BYTES: "26214400"
  INBOUND_MEDIA_TTL: 168h
  # each tenant's request budget PER GATEWAY REPLICA (0 turns it off)
  API_RATE_PER_SECOND: "50"
  API_RATE_BURST: "100"
  # personal content: finished messages lose recipient and text after 90 days, the webhook DLQ is deleted after 30 (0 keeps forever)
  RETENTION_MESSAGES: 2160h
  RETENTION_DEAD_DELIVERIES: 720h
  RETENTION_PENDING_DELIVERIES: 720h   # deliveries still waiting (e.g. a subscription left paused) are deleted after this long
  WEBHOOK_MAX_IN_FLIGHT_PER_SUBSCRIPTION: "32"
  WEBHOOK_MAX_PENDING_PER_SUBSCRIPTION: "100000"   # deliveries a subscription may have waiting; the next ones go to its DLQ (0 = unlimited)
  OUTBOX_INTERVAL: 250ms
  # tenant webhooks: https + public destinations only in production (APP_ENV=production)
  WEBHOOKS_MAX_PER_TENANT: "10"
  # id/endpoint/capacity per node; api_key values come from the Secret (PROVIDER_NODES is assembled by your secret tooling)
---
# Expected Secret `relayplane-secrets` keys: DATABASE_URL, BLOB_STORE_ACCESS_KEY, BLOB_STORE_SECRET_KEY,
# WEBHOOK_SECRET, SUBSCRIPTION_SECRET (optional), ERASURE_KEY (optional, keep it STABLE), ADMIN_API_KEY, ADMIN_API_KEY_PREVIOUS (optional, only while rotating it), PROVIDER_NODES, EVOLUTION_API_KEY, EVOLUTION_DATABASE_URI_BASE
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway, namespace: relayplane}
spec:
  replicas: 2
  selector: {matchLabels: {app: gateway}}
  template:
    metadata: {labels: {app: gateway}, annotations: {prometheus.io/scrape: "true", prometheus.io/port: "9090"}}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: registry.example.com/relayplane/gateway:0.1.0@sha256:REPLACE_WITH_BUILD_DIGEST
          ports: [{containerPort: 8080, name: http}, {containerPort: 9090, name: ops}]
          # no AUTO_MIGRATE: the relayplane-migrate Job migrates the schema before the rollout
          env: [{name: HTTP_PORT, value: "8080"}, {name: OPS_PORT, value: "9090"}]
          envFrom: [{configMapRef: {name: relayplane-config}}, {secretRef: {name: relayplane-secrets}}]
          readinessProbe: {httpGet: {path: /health/ready, port: 8080}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: 8080}, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: gateway, namespace: relayplane}
spec:
  selector: {app: gateway}
  ports: [{port: 8080, targetPort: 8080}]   # the API and the provider webhooks only; the ops port 9090 is not exposed
---
# Schema migrations, once per release, before the rollout (see the header). Same image as the gateway: `/app migrate` applies
# the migrations under the store's advisory lock and exits. It needs only DATABASE_URL.
apiVersion: batch/v1
kind: Job
metadata: {name: relayplane-migrate, namespace: relayplane, labels: {app.kubernetes.io/component: migrate}}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  template:
    metadata: {labels: {app: relayplane-migrate}}
    spec:
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: migrate
          image: registry.example.com/relayplane/gateway:0.1.0@sha256:REPLACE_WITH_BUILD_DIGEST
          args: ["migrate"]
          env: [{name: DATABASE_URL, valueFrom: {secretKeyRef: {name: relayplane-secrets, key: DATABASE_URL}}}]
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: relayplane}
spec:
  replicas: 3
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}, annotations: {prometheus.io/scrape: "true", prometheus.io/port: "9090"}}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: registry.example.com/relayplane/worker:0.1.0@sha256:REPLACE_WITH_BUILD_DIGEST
          env: [{name: OPS_PORT, value: "9090"}]
          envFrom: [{configMapRef: {name: relayplane-config}}, {secretRef: {name: relayplane-secrets}}]
          readinessProbe: {httpGet: {path: /health/ready, port: 9090}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health/live, port: 9090}, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: reconciler, namespace: relayplane}
spec:
  replicas: 2   # replicas are safe: per-instance leases + compare-and-set in the catalog
  selector: {matchLabels: {app: reconciler}}
  template:
    metadata: {labels: {app: reconciler}, annotations: {prometheus.io/scrape: "true", prometheus.io/port: "9090"}}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: reconciler
          image: registry.example.com/relayplane/reconciler:0.1.0@sha256:REPLACE_WITH_BUILD_DIGEST
          env: [{name: OPS_PORT, value: "9090"}]
          envFrom: [{configMapRef: {name: relayplane-config}}, {secretRef: {name: relayplane-secrets}}]
          readinessProbe: {httpGet: {path: /health/ready, port: 9090}, periodSeconds: 10}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
# Evolution provider nodes: singletons with stable identity. Never scale a node's replicas above 1:
# add nodes by growing this StatefulSet (new ordinal = new identity) AND adding it to PROVIDER_NODES.
apiVersion: v1
kind: Service
metadata: {name: evolution-v2, namespace: relayplane}
spec:
  clusterIP: None
  selector: {app: evolution-v2}
  ports: [{port: 8080}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: evolution-v2, namespace: relayplane}
spec:
  serviceName: evolution-v2
  replicas: 2
  podManagementPolicy: OrderedReady
  # a node is replaced only on command (kubectl delete pod, after draining it in RelayPlane: docs/runbooks/PROVIDER-UPGRADE.md),
  # never by a rollout that restarts every node in a row: each restart is downtime for the sessions that node holds
  updateStrategy: {type: OnDelete}
  selector: {matchLabels: {app: evolution-v2}}
  template:
    metadata: {labels: {app: evolution-v2}}
    spec:
      containers:
        - name: evolution
          image: registry.example.com/relayplane/evolution:2.3.7-baileys-rc13@sha256:REPLACE_WITH_BUILD_DIGEST  # built from deploy/docker/evolution/Dockerfile (Baileys 7.0.0-rc13)
          ports: [{containerPort: 8080}]
          env:
            - {name: DATABASE_PROVIDER, value: postgresql}
            - {name: DATABASE_ENABLED, value: "true"}
            - {name: CACHE_REDIS_ENABLED, value: "false"}
            - {name: CACHE_LOCAL_ENABLED, value: "true"}
            - {name: TZ, value: UTC}
            - {name: TELEMETRY_ENABLED, value: "false"}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: AUTHENTICATION_API_KEY, valueFrom: {secretKeyRef: {name: relayplane-secrets, key: EVOLUTION_API_KEY}}}
            # ONE DATABASE PER NODE, derived from the pod's stable name: evolution-v2-0 -> <base>/evolution-v2-0. The database is the
            # node's only state (the WhatsApp sessions), so a replacement pod with the same name reconnects without a QR code, and two
            # nodes can never share one. Create the databases beforehand (docs/runbooks/NODE-REPLACEMENT.md).
            # EVOLUTION_DATABASE_URI_BASE is the Secret's connection URI WITHOUT the database name, e.g. postgresql://user:pass@host:5432
            - {name: EVOLUTION_DATABASE_URI_BASE, valueFrom: {secretKeyRef: {name: relayplane-secrets, key: EVOLUTION_DATABASE_URI_BASE}}}
            - {name: DATABASE_CONNECTION_URI, value: "$(EVOLUTION_DATABASE_URI_BASE)/$(POD_NAME)"}
            - {name: DATABASE_CONNECTION_CLIENT_NAME, value: "$(POD_NAME)"}
          readinessProbe: {httpGet: {path: /, port: 8080}, initialDelaySeconds: 30, periodSeconds: 10}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {memory: 2Gi}}
---
# Voluntary disruptions (node drains, cluster upgrades) never take a whole tier down at once.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: gateway, namespace: relayplane}
spec: {minAvailable: 1, selector: {matchLabels: {app: gateway}}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: worker, namespace: relayplane}
spec: {maxUnavailable: 1, selector: {matchLabels: {app: worker}}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: reconciler, namespace: relayplane}
spec: {minAvailable: 1, selector: {matchLabels: {app: reconciler}}}
---
# A provider node is a singleton holding live WhatsApp sessions: an eviction is an outage for them. Nothing may evict one on its
# own; replace a node deliberately (docs/runbooks/NODE-REPLACEMENT.md), which deletes the pod instead of evicting it.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: evolution-v2, namespace: relayplane}
spec: {maxUnavailable: 0, selector: {matchLabels: {app: evolution-v2}}}
---
# Ingress is denied by default in the namespace; the policies below open only what is needed. Egress stays open (PostgreSQL,
# Redis and the object store may be managed services, tenant webhooks go to the internet, the nodes talk to WhatsApp).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: relayplane}
spec: {podSelector: {}, policyTypes: [Ingress]}
---
# the public API and the provider webhooks (from the ingress controller and from the nodes)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: gateway-api, namespace: relayplane}
spec:
  podSelector: {matchLabels: {app: gateway}}
  policyTypes: [Ingress]
  ingress: [{ports: [{port: 8080, protocol: TCP}]}]
---
# the Evolution API holds the session keys: only RelayPlane's own binaries may call it
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: evolution-from-relayplane, namespace: relayplane}
spec:
  podSelector: {matchLabels: {app: evolution-v2}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchExpressions: [{key: app, operator: In, values: [gateway, worker, reconciler]}]}}]
      ports: [{port: 8080, protocol: TCP}]
---
# metrics and health on the ops port, for Prometheus only (label its namespace relayplane.io/monitoring=true)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ops-from-monitoring, namespace: relayplane}
spec:
  podSelector: {matchExpressions: [{key: app, operator: In, values: [gateway, worker, reconciler]}]}
  policyTypes: [Ingress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {relayplane.io/monitoring: "true"}}}]
      ports: [{port: 9090, protocol: TCP}]
